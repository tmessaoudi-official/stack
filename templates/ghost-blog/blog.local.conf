<VirtualHost *:80>
    RewriteEngine On

    ServerName blog.local
    ServerAlias blog.local
    ServerAdmin webmaster@blog.local

    ProxyPreserveHost On
    ProxyPass / http://ghost-blog:2368/
    ProxyPassReverse / http://ghost-blog:2368/

    ErrorLog ${APACHE_LOG_DIR}/blog.local-error.log
    CustomLog ${APACHE_LOG_DIR}/blog.local-access.log combined
</VirtualHost>