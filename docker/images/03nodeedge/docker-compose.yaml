---
services:
  03nodeedge:
    extends:
      file: docker/config/compose-fragments/node-packages.compose.yaml
      service: node-packages
    build:
      args:
        BUILDKIT_INLINE_CACHE: 1
        GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_ALIAS: ${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_ALIAS}
        GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_PORT_5000: ${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_PORT_5000}
        GLOBAL_STACK_VERSION: ${GLOBAL_STACK_VERSION}
      context: ./
      dockerfile: ./docker/images/03nodeedge/Dockerfile
    depends_on:
      00base:
        condition: service_healthy
        required: true
      02nvm:
        condition: service_healthy
        required: true
    environment:
      - NVM_MODE=setup
      - NVM_NODEJS_ORG_MIRROR=https://nodejs.org/download/nightly
      - GLOBAL_STACK_RELOAD_NODE=${GLOBAL_STACK_RELOAD_NODEEDGE}
      - DENO_INSTALL=${GLOBAL_STACK_DENO_INSTALL}
      - DENO_INSTALL_ROOT=${GLOBAL_STACK_DENO_INSTALL_ROOT}
      - DENO_DIR=${GLOBAL_STACK_DENO_DIR}
      - BUN_INSTALL=${GLOBAL_STACK_BUN_INSTALL}
      - NVM_DIR=${GLOBAL_STACK_NVM_DIR}
      - YARN_OFFLINE_MIRROR=${GLOBAL_STACK_YARN_OFFLINE_MIRROR}
      - YARN_CACHE_FOLDER=${GLOBAL_STACK_YARN_CACHE_FOLDER}
      - YARN_GLOBAL_FOLDER=${GLOBAL_STACK_YARN_GLOBAL_FOLDER}
      - GLOBAL_STACK_PNPM_GLOBAL_DIR=${GLOBAL_STACK_PNPM_GLOBAL_DIR}
      - PNPM_HOME=${GLOBAL_STACK_PNPM_GLOBAL_DIR}
      - GLOBAL_STACK_PNPM_STORE_DIR=${GLOBAL_STACK_PNPM_STORE_DIR}
      - NPM_CACHE_DIR=${GLOBAL_STACK_NPM_CACHE_DIR}
      - CYPRESS_CACHE_FOLDER=${GLOBAL_STACK_CYPRESS_CACHE_FOLDER}
      - NODE_VERSION_AS=${GLOBAL_STACK_NODEEDGE_VERSION_AS}
      - NODE_VERSION=${GLOBAL_STACK_NODEEDGE_VERSION}
      - GLOBAL_STACK_NODE_UPGRADE=${GLOBAL_STACK_NODEEDGE_UPGRADE}
      - GLOBAL_STACK_NODE_UPGRADE_ALL=${GLOBAL_STACK_NODE_UPGRADE_ALL}
      - GLOBAL_STACK_ERROR_TOKEN=node.${GLOBAL_STACK_NODEEDGE_VERSION_AS}
      # @types/node:27 dist-tag not yet published; track :25 until node 27 types ship
      - NODE_INSTALL_PACKAGE_TYPES_NODE_VERSION=${GLOBAL_STACK_NODEEDGE_INSTALL_PACKAGE_TYPES_NODE_VERSION}
      # cordova-res not yet compatible with node edge !
      - NODE_INSTALL_PACKAGE_CORDOVA_RES_VERSION=${GLOBAL_STACK_NODEEDGE_INSTALL_PACKAGE_CORDOVA_RES_VERSION}
    image: ${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_ALIAS}:${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_PORT_5000}/local_global_stack_03nodeedge:${GLOBAL_STACK_VERSION}
    healthcheck:
      test: ["CMD-SHELL", "! test -f ${GLOBAL_STACK_DOCKER_TOOLS_PATH_ERRORS}/node.${GLOBAL_STACK_NODEEDGE_VERSION_AS} && test -f ${GLOBAL_STACK_DOCKER_TOOLS_PATH_SUCCESSES}/node.${GLOBAL_STACK_NODEEDGE_VERSION_AS} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 99999
      start_period: 24h
    labels:
      stack.service: "03nodeedge"
      stack.tier: "runtime"
      stack.version: "${GLOBAL_STACK_VERSION}"
