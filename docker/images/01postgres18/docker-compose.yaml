---
services:
  01postgres18:
    init: ${DOCKER_INIT}
    build:
      args:
        BUILDKIT_INLINE_CACHE: 1
        GLOBAL_STACK_IMAGE_POSTGRES18_VERSION: ${GLOBAL_STACK_IMAGE_POSTGRES18_VERSION}
      context: ./
      dockerfile: ./docker/images/01postgres18/Dockerfile
    depends_on:
      00base:
        condition: service_healthy
        required: true
    environment:
      - POSTGRES_DBS=${GLOBAL_STACK_POSTGRES18_DBS}
      - POSTGRES_PASSWORD=${GLOBAL_STACK_DATABASE_ROOT_PASSWORD}
      - POSTGRES_USER=root
      # Alpine (musl) has no glibc locales: localedef is absent and
      # /usr/lib/locale is empty. But the image ships LANG=en_US.utf8,
      # so initdb recorded datcollate=en_US.utf8 under the libc provider
      # and silently degraded to C -- ORDER BY gave code-point order
      # ('Banana,Zebra,apple') while pg_database claimed en_US.utf8.
      # That gap stays invisible until dev and a glibc production
      # disagree about sort order. The builtin provider gives the SAME
      # ordering, honestly labelled, with no system locale needed.
      # LANG must be overridden too: datcollate/datctype come from it,
      # not from --builtin-locale. Do NOT add --lc-collate/--lc-ctype --
      # initdb rejects them with the builtin provider and startup fails.
      # Only affects a FRESH cluster: initdb runs on an empty data dir,
      # so an existing volume keeps the old metadata until recreated.
      - POSTGRES_INITDB_ARGS=--locale-provider=builtin --builtin-locale=C.UTF-8
      - LANG=C.UTF-8
      # docker-entrypoint.sh stops its init-time temp server with
      # `pg_ctl -m fast -w stop`, whose 60 s default gave up under build
      # load on 2026-09-28 ("server does not shut down") and restarted the
      # container mid-init. pg_ctl reads this variable; gosu keeps it.
      - PGCTLTIMEOUT=300
      - TZ=${GLOBAL_STACK_TIMEZONE}
      - GLOBAL_STACK_DOCKER_TOOLS_PATH=${GLOBAL_STACK_DOCKER_TOOLS_PATH}
      - GLOBAL_STACK_DOCKER_TOOLS_PATH_SUCCESSES=${GLOBAL_STACK_DOCKER_TOOLS_PATH_SUCCESSES}
      - GLOBAL_STACK_DOCKER_TOOLS_PATH_ERRORS=${GLOBAL_STACK_DOCKER_TOOLS_PATH_ERRORS}
      - GLOBAL_STACK_DOCKER_ROOT_DIST_PATH=${GLOBAL_STACK_DOCKER_ROOT_DIST_PATH}
      - GLOBAL_STACK_WAIT_FOR_TIMEOUT=${GLOBAL_STACK_WAIT_FOR_TIMEOUT}
    networks:
      - public
    # TCP, not the socket: the entrypoint's init-time temp server listens on
    # the socket only (listen_addresses=''), so a socket pg_isready passed
    # against it and marked Postgres healthy before the real server existed
    # (02sonarqube then exited 0 and was never retried, 2026-09-28). A TCP
    # check fails for the whole init, so the window must be the stack's
    # patient one: 30 s + 5 x 10 s would mark it UNHEALTHY and abort every
    # service_healthy dependent. bin/tests/postgres-healthcheck.test.sh
    healthcheck:
      test: ["CMD-SHELL", "${GLOBAL_STACK_DOCKER_ROOT_DIST_PATH}/bin/base-bin/global-stack-base-healthcheck-elapsed.sh 01postgres18 pg_isready -U root -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 99999
      start_period: 24h
    labels:
      stack.service: "01postgres18"
      stack.tier: "database"
      stack.version: "${GLOBAL_STACK_VERSION}"
    restart: "on-failure:5"
    shm_size: ${GLOBAL_STACK_POSTGRES18_SHM_SIZE:-1gb}
    ports:
      - ${GLOBAL_STACK_POSTGRES18_PORT_5432:-}5432
    volumes:
      - ./tools:${GLOBAL_STACK_DOCKER_TOOLS_PATH}:rw
      - ./docker/config/dist/bin:${GLOBAL_STACK_DOCKER_ROOT_DIST_PATH}/bin:rw
      - ./docker/data/dumps/postgres/18:/opt/dumps:rw
      - 01postgres18_var_lib_postgresql:/var/lib/postgresql:rw,delegated
      - ./${GLOBAL_STACK_SHELL_HISTORY}:/root/${GLOBAL_STACK_SHELL_HISTORY_TARGET}:rw
      - ./${GLOBAL_STACK_SHELL_ZSH_HISTORY}:/root/${GLOBAL_STACK_SHELL_ZSH_HISTORY_TARGET}:rw
        # - ./var/database-history/.psql_history:/root/.psql_history:rw,delegated
        # - source: ./docker/logs/postgresql/18
        #   target: /var/log/postgresql
        #   type: bind
volumes:
  01postgres18_var_lib_postgresql:
    name: ${COMPOSE_PROJECT_NAME}_${GLOBAL_STACK_VERSION}_01postgres18_var_lib_postgresql
