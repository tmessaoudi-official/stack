---
services:
  02rust:
    extends:
      file: docker/config/compose-fragments/base-6vol.compose.yaml
      service: base-6vol
    build:
      args:
        BUILDKIT_INLINE_CACHE: 1
        GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_ALIAS: ${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_ALIAS}
        GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_PORT_5000: ${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_PORT_5000}
        GLOBAL_STACK_VERSION: ${GLOBAL_STACK_VERSION}
      context: ./
      dockerfile: ./docker/images/02rust/Dockerfile
    depends_on:
      00base:
        condition: service_healthy
        required: true
    environment:
      - GLOBAL_STACK_RELOAD_RUST=${GLOBAL_STACK_RELOAD_RUST}
      - GLOBAL_STACK_RUST_VERSION=${GLOBAL_STACK_RUST_VERSION}
      - GLOBAL_STACK_RUSTUP_INIT_VERSION=${GLOBAL_STACK_RUSTUP_INIT_VERSION}
      - RUSTUP_HOME=${GLOBAL_STACK_RUSTUP_HOME}
      - CARGO_HOME=${GLOBAL_STACK_CARGO_HOME}
      - GLOBAL_STACK_ERROR_TOKEN=rust
    image: ${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_ALIAS}:${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_PORT_5000}/local_global_stack_02rust:${GLOBAL_STACK_VERSION}
    healthcheck:
      test: ["CMD-SHELL", "! test -f ${GLOBAL_STACK_DOCKER_TOOLS_PATH_ERRORS}/rust && test -f ${GLOBAL_STACK_DOCKER_TOOLS_PATH_SUCCESSES}/rust || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 99999
      start_period: 24h
    labels:
      stack.service: "02rust"
      stack.tier: "runtime"
      stack.version: "${GLOBAL_STACK_VERSION}"
