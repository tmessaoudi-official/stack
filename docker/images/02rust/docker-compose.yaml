---
services:
  02rust:
    extends:
      file: docker/config/compose-fragments/base-6vol.compose.yaml
      service: base-6vol
    build:
      args:
        BUILDKIT_INLINE_CACHE: 1
        GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_ALIAS: ${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_ALIAS}
        GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_PORT_5000: ${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_PORT_5000}
        GLOBAL_STACK_VERSION: ${GLOBAL_STACK_VERSION}
      context: ./
      dockerfile: ./docker/images/02rust/Dockerfile
    depends_on:
      00base:
        condition: service_healthy
        required: true
    environment:
      - GLOBAL_STACK_RELOAD_RUST=${GLOBAL_STACK_RELOAD_RUST}
      - GLOBAL_STACK_RUST_VERSION=${GLOBAL_STACK_RUST_VERSION}
      - GLOBAL_STACK_RUSTUP_INIT_VERSION=${GLOBAL_STACK_RUSTUP_INIT_VERSION}
      # Row 18: these five reached the container ONLY through the 00base image ENV
      # (Dockerfile ARG->ENV), which is baked at build time — so a .env bump was
      # invisible to a runtime gate until the image was rebuilt, and the gate would
      # have compared against a stale baked value forever. Same defect shape as
      # GLOBAL_STACK_USE_LOCKS in Track 2b. Passing them at runtime fixes that.
      - GLOBAL_STACK_CARGO_NEXTEST_VERSION=${GLOBAL_STACK_CARGO_NEXTEST_VERSION}
      - GLOBAL_STACK_CARGO_OUTDATED_VERSION=${GLOBAL_STACK_CARGO_OUTDATED_VERSION}
      - GLOBAL_STACK_CARGO_ZIGBUILD_VERSION=${GLOBAL_STACK_CARGO_ZIGBUILD_VERSION}
      - GLOBAL_STACK_JUJUTSU_VERSION=${GLOBAL_STACK_JUJUTSU_VERSION}
      - GLOBAL_STACK_MERGIRAF_VERSION=${GLOBAL_STACK_MERGIRAF_VERSION}
      - RUSTUP_HOME=${GLOBAL_STACK_RUSTUP_HOME}
      - CARGO_HOME=${GLOBAL_STACK_CARGO_HOME}
      - GLOBAL_STACK_WAIT_FOR_TIMEOUT=${GLOBAL_STACK_WAIT_FOR_TIMEOUT}
      - GLOBAL_STACK_ERROR_TOKEN=rust
    image: ${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_ALIAS}:${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_PORT_5000}/local_global_stack_02rust:${GLOBAL_STACK_VERSION}
    healthcheck:
      test: ["CMD-SHELL", "! test -f ${GLOBAL_STACK_DOCKER_TOOLS_PATH_ERRORS}/rust && test -f ${GLOBAL_STACK_DOCKER_TOOLS_PATH_SUCCESSES}/rust || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 99999
      start_period: 24h
    labels:
      stack.service: "02rust"
      stack.tier: "runtime"
      stack.version: "${GLOBAL_STACK_VERSION}"
