---
services:
  01mariadb12:
    init: ${DOCKER_INIT}
    build:
      args:
        BUILDKIT_INLINE_CACHE: 1
        GLOBAL_STACK_IMAGE_MARIADB12_VERSION: ${GLOBAL_STACK_IMAGE_MARIADB12_VERSION}
        GLOBAL_STACK_IMAGE_UBUNTU_VERSION: ${GLOBAL_STACK_IMAGE_UBUNTU_VERSION}
      context: ./
      dockerfile: ./docker/images/01mariadb12/Dockerfile
    command:
      - mariadbd
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=${GLOBAL_STACK_DATABASE_CHARSET}
      - --collation-server=${GLOBAL_STACK_DATABASE_COLLATE}
    environment:
      - MARIADB_DBS=${GLOBAL_STACK_MARIADB12_DBS}
      - MYSQL_PASSWORD=${GLOBAL_STACK_DATABASE_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${GLOBAL_STACK_DATABASE_ROOT_PASSWORD}
      - MYSQL_USER=${GLOBAL_STACK_DATABASE_USER}
      - GLOBAL_STACK_DATABASE_CHARSET=${GLOBAL_STACK_DATABASE_CHARSET}
      - GLOBAL_STACK_DATABASE_COLLATE=${GLOBAL_STACK_DATABASE_COLLATE}
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - TZ=${GLOBAL_STACK_TIMEZONE}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      stack.service: "01mariadb12"
      stack.tier: "database"
      stack.version: "${GLOBAL_STACK_VERSION}"
    networks:
      - public
    restart: "on-failure:5"
    ports:
      - ${GLOBAL_STACK_MARIADB12_PORT_3306:-}3306
    volumes:
      - ./docker/data/dumps/mariadb/12:/opt/dumps:rw
      - 01mariadb12_data:/var/lib/mysql:rw,delegated
      - ./${GLOBAL_STACK_SHELL_HISTORY}:/root/${GLOBAL_STACK_SHELL_HISTORY_TARGET}:rw
      - ./${GLOBAL_STACK_SHELL_ZSH_HISTORY}:/root/${GLOBAL_STACK_SHELL_ZSH_HISTORY_TARGET}:rw
        # - ./var/database-history/.mariadb_history:/root/.mariadb_history:rw,delegated
        # - source: ./docker/logs/mariadb/12
        #   target: /var/log/mysql
        #   type: bind
volumes:
  01mariadb12_data:
    name: ${COMPOSE_PROJECT_NAME}_${GLOBAL_STACK_VERSION}_01mariadb12_data
