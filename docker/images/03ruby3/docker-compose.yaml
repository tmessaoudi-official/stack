---
services:
  03ruby3:
    extends:
      file: docker/config/compose-fragments/ruby-packages.compose.yaml
      service: ruby-packages
    build:
      args:
        BUILDKIT_INLINE_CACHE: 1
        GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_ALIAS: ${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_ALIAS}
        GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_PORT_5000: ${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_PORT_5000}
        GLOBAL_STACK_VERSION: ${GLOBAL_STACK_VERSION}
      context: ./
      dockerfile: ./docker/images/03ruby3/Dockerfile
    depends_on:
      00base:
        condition: service_healthy
        required: true
      02rbenv:
        condition: service_healthy
        required: true
    environment:
      - RBENV_MODE=setup
      - GLOBAL_STACK_RBENV_VERSION=${GLOBAL_STACK_RBENV_VERSION}
      - GLOBAL_STACK_RBENV_RUBY_BUILD_VERSION=${GLOBAL_STACK_RBENV_RUBY_BUILD_VERSION}
      - GLOBAL_STACK_RBENV_GEMSET_VERSION=${GLOBAL_STACK_RBENV_GEMSET_VERSION}
      - GLOBAL_STACK_RELOAD_RUBY=${GLOBAL_STACK_RELOAD_RUBY}
      - GLOBAL_STACK_RELOAD_RUBY=${GLOBAL_STACK_RELOAD_RUBY3}
      - RBENV_ROOT=${GLOBAL_STACK_RBENV_ROOT}
      - RUBY_VERSION=${GLOBAL_STACK_RUBY3_VERSION}
      - RUBY_VERSION_AS=${GLOBAL_STACK_RUBY3_VERSION_AS}
      - GLOBAL_STACK_ERROR_TOKEN=ruby.${GLOBAL_STACK_RUBY3_VERSION_AS}
    image: ${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_ALIAS}:${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_PORT_5000}/local_global_stack_03ruby3:${GLOBAL_STACK_VERSION}
    healthcheck:
      test: ["CMD-SHELL", "! test -f ${GLOBAL_STACK_DOCKER_TOOLS_PATH_ERRORS}/ruby.${GLOBAL_STACK_RUBY3_VERSION_AS} && test -f ${GLOBAL_STACK_DOCKER_TOOLS_PATH_SUCCESSES}/ruby.${GLOBAL_STACK_RUBY3_VERSION_AS} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 99999
      start_period: 24h
    labels:
      stack.service: "03ruby3"
      stack.tier: "runtime"
      stack.version: "${GLOBAL_STACK_VERSION}"
