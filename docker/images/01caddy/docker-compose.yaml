---
services:
  01caddy:
    extends:
      file: docker/config/compose-fragments/base-env.compose.yaml
      service: base-env
    init: ${DOCKER_INIT}
    build:
      args:
        BUILDKIT_INLINE_CACHE: 1
        GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_ALIAS: ${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_ALIAS}
        GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_PORT_5000: ${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_PORT_5000}
        GLOBAL_STACK_VERSION: ${GLOBAL_STACK_VERSION}
      context: ./
      dockerfile: ./docker/images/01caddy/Dockerfile
    cap_add:
      - NET_ADMIN
    depends_on:
      00base:
        condition: service_healthy
        required: true
    extra_hosts:
      - ${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_ALIAS}:${GLOBAL_STACK_HOST_GATEWAY_IP}
      - ${GLOBAL_STACK_DOCKER_HOST_DSN}:${GLOBAL_STACK_HOST_GATEWAY_IP}
      - ${GLOBAL_STACK_EXPOSED_VIRTUAL_HOSTS}:${GLOBAL_STACK_HOST_GATEWAY_IP}
    environment:
      - GLOBAL_STACK_EXPOSED_VIRTUAL_HOSTS=${GLOBAL_STACK_EXPOSED_VIRTUAL_HOSTS}
      - GLOBAL_STACK_CADDY_VERSION=${GLOBAL_STACK_CADDY_VERSION}
      - GLOBAL_STACK_RELOAD_CADDY=${GLOBAL_STACK_RELOAD_CADDY}
      - GLOBAL_STACK_WAIT_FOR_TIMEOUT=${GLOBAL_STACK_WAIT_FOR_TIMEOUT}
      # Token-invariant exception (CLAUDE.md § Gotchas): caddy, nginx and httpd
      # are interchangeable alternatives sharing ONE success marker
      # (successes/web-server), so the ERROR token is per-service while the
      # success token stays shared. Without it nothing writes an error file and
      # a failed web server hangs its consumers for the full wait timeout.
      - GLOBAL_STACK_ERROR_TOKEN=caddy
    ports:
      - ${GLOBAL_STACK_CADDY_PORT_2019:-}2019
      - ${GLOBAL_STACK_HTTP_PORT_8080:-}8080
      - ${GLOBAL_STACK_HTTPS_PORT_8443:-}8443
    networks:
      - public
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:2019/metrics -o /dev/null || curl -fs http://localhost:8080/ -o /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 99999
      start_period: 24h
    labels:
      stack.service: "01caddy"
      stack.tier: "web"
      stack.version: "${GLOBAL_STACK_VERSION}"
    privileged: true
    restart: "on-failure:5"
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:rw,delegated
      - ./projects:${GLOBAL_STACK_DOCKER_WORKDIR}:rw
      - ./tools:${GLOBAL_STACK_DOCKER_TOOLS_PATH}:rw
      - ./${GLOBAL_STACK_SHELL_HISTORY}:/home/${GLOBAL_STACK_DOCKER_USER_ID}/${GLOBAL_STACK_SHELL_HISTORY_TARGET}:rw
      - ./${GLOBAL_STACK_SHELL_ZSH_HISTORY}:/home/${GLOBAL_STACK_DOCKER_USER_ID}/${GLOBAL_STACK_SHELL_ZSH_HISTORY_TARGET}:rw
      - ./docker/config/root:${GLOBAL_STACK_DOCKER_ROOT_DIST_PATH}/home/user:rw
      - ./docker/config/dist/bin:${GLOBAL_STACK_DOCKER_ROOT_DIST_PATH}/bin:rw
      - ./docker/config/dist/conf:${GLOBAL_STACK_DOCKER_ROOT_DIST_PATH}/conf:rw
    working_dir: ${GLOBAL_STACK_DOCKER_WORKDIR}
