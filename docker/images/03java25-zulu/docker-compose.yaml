---
services:
  03java25-zulu:
    extends:
      file: docker/config/compose-fragments/java-packages.compose.yaml
      service: java-packages
    build:
      args:
        BUILDKIT_INLINE_CACHE: 1
        GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_ALIAS: ${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_ALIAS}
        GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_PORT_5000: ${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_PORT_5000}
        GLOBAL_STACK_VERSION: ${GLOBAL_STACK_VERSION}
      context: ./
      dockerfile: ./docker/images/03java25-zulu/Dockerfile
    depends_on:
      00base:
        condition: service_healthy
        required: true
      02sdkman:
        condition: service_healthy
        required: true
    environment:
      - SDKMAN_MODE=setup
      - GLOBAL_STACK_SDKMAN_VERSION=${GLOBAL_STACK_SDKMAN_VERSION}
      - SDKMAN_DIR=${GLOBAL_STACK_SDKMAN_DIR}
      - JAVA_VERSION_AS=${GLOBAL_STACK_JAVA25_VERSION_AS}
      - JAVA_VERSION=${GLOBAL_STACK_JAVA25_VERSION}
      - GLOBAL_STACK_ERROR_TOKEN=java.${GLOBAL_STACK_JAVA25_VERSION_AS}
      # Java 25 per-tier exclusions (empty version = base_setup_packages skips the package)
      - SDKMAN_INSTALL_PACKAGE_02_GRADLE_VX2_VERSION=  # Gradle 8 daemon crashes on Java 25 (compat matrix: Java 25 requires minimum Gradle 9.1.0)
      - SDKMAN_INSTALL_PACKAGE_08_GROOVY_VX2_VERSION=  # Groovy 4 not in official Java 25 test matrix
      - SDKMAN_INSTALL_PACKAGE_11_SPARK_VX1_VERSION=   # Spark 4.x officially supports Java 17/21 only
      - SDKMAN_INSTALL_PACKAGE_11_SPARK_VX2_VERSION=   # Spark 3.5.x: EOL + no Java 25 support
    image: ${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_ALIAS}:${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_PORT_5000}/local_global_stack_03java25-zulu:${GLOBAL_STACK_VERSION}
    healthcheck:
      test: ["CMD-SHELL", "! test -f ${GLOBAL_STACK_DOCKER_TOOLS_PATH_ERRORS}/java.${GLOBAL_STACK_JAVA25_VERSION_AS} && test -f ${GLOBAL_STACK_DOCKER_TOOLS_PATH_SUCCESSES}/java.${GLOBAL_STACK_JAVA25_VERSION_AS} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 99999
      start_period: 24h
    labels:
      stack.service: "03java25-zulu"
      stack.tier: "runtime"
      stack.version: "${GLOBAL_STACK_VERSION}"
