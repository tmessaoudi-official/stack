---
services:
  02sdkman:
    extends:
      file: docker/config/compose-fragments/base.compose.yaml
      service: base
    build:
      args:
        BUILDKIT_INLINE_CACHE: 1
        GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_ALIAS: ${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_ALIAS}
        GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_PORT_5000: ${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_PORT_5000}
        GLOBAL_STACK_VERSION: ${GLOBAL_STACK_VERSION}
      context: ./
      dockerfile: ./docker/images/02sdkman/Dockerfile
    depends_on:
      00base:
        condition: service_healthy
        required: true
    environment:
      - SDKMAN_MODE=install
      - GLOBAL_STACK_RELOAD_SDKMAN=${GLOBAL_STACK_RELOAD_SDKMAN}
      - GLOBAL_STACK_SDKMAN_VERSION=${GLOBAL_STACK_SDKMAN_VERSION}
      - SDKMAN_DIR=${GLOBAL_STACK_SDKMAN_DIR}
      - GLOBAL_STACK_WAIT_FOR_TIMEOUT=${GLOBAL_STACK_WAIT_FOR_TIMEOUT}
      - GLOBAL_STACK_ERROR_TOKEN=sdkman
    image: ${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_ALIAS}:${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_PORT_5000}/local_global_stack_02sdkman:${GLOBAL_STACK_VERSION}
    healthcheck:
      test: ["CMD-SHELL", "! test -f ${GLOBAL_STACK_DOCKER_TOOLS_PATH_ERRORS}/sdkman && test -f ${GLOBAL_STACK_DOCKER_TOOLS_PATH_SUCCESSES}/sdkman || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 99999
      start_period: 24h
    labels:
      stack.service: "02sdkman"
      stack.tier: "runtime"
      stack.version: "${GLOBAL_STACK_VERSION}"
