---
services:
  03java21-zulu:
    extends:
      file: docker/config/compose-fragments/java-packages.compose.yaml
      service: java-packages
    build:
      args:
        BUILDKIT_INLINE_CACHE: 1
        GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_ALIAS: ${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_ALIAS}
        GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_PORT_5000: ${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_PORT_5000}
        GLOBAL_STACK_VERSION: ${GLOBAL_STACK_VERSION}
      context: ./
      dockerfile: ./docker/images/03java21-zulu/Dockerfile
    depends_on:
      00base:
        condition: service_healthy
        required: true
      02sdkman:
        condition: service_healthy
        required: true
    environment:
      - SDKMAN_MODE=setup
      - GLOBAL_STACK_SDKMAN_VERSION=${GLOBAL_STACK_SDKMAN_VERSION}
      - SDKMAN_DIR=${GLOBAL_STACK_SDKMAN_DIR}
      - GLOBAL_STACK_RELOAD_SDKMAN=${GLOBAL_STACK_RELOAD_SDKMAN}
      - GLOBAL_STACK_RELOAD_JAVA_VERSION=${GLOBAL_STACK_RELOAD_JAVA_21}
      - JAVA_VERSION_AS=${GLOBAL_STACK_JAVA21_VERSION_AS}
      - JAVA_VERSION=${GLOBAL_STACK_JAVA21_VERSION}
      - GLOBAL_STACK_ERROR_TOKEN=java.${GLOBAL_STACK_JAVA21_VERSION_AS}
    image: ${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_ALIAS}:${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_PORT_5000}/local_global_stack_03java21-zulu:${GLOBAL_STACK_VERSION}
    healthcheck:
      test: ["CMD-SHELL", "! test -f ${GLOBAL_STACK_DOCKER_TOOLS_PATH_ERRORS}/java.${GLOBAL_STACK_JAVA21_VERSION_AS} && test -f ${GLOBAL_STACK_DOCKER_TOOLS_PATH_SUCCESSES}/java.${GLOBAL_STACK_JAVA21_VERSION_AS} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 99999
      start_period: 24h
    labels:
      stack.service: "03java21-zulu"
      stack.tier: "runtime"
      stack.version: "${GLOBAL_STACK_VERSION}"
