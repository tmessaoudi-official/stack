---
services:
  01mysql9:
    init: ${DOCKER_INIT}
    build:
      args:
        BUILDKIT_INLINE_CACHE: 1
        GLOBAL_STACK_IMAGE_MYSQL9_VERSION: ${GLOBAL_STACK_IMAGE_MYSQL9_VERSION}
        GLOBAL_STACK_DATABASE_CHARSET: ${GLOBAL_STACK_DATABASE_CHARSET}
        GLOBAL_STACK_DATABASE_COLLATE: ${GLOBAL_STACK_DATABASE_COLLATE}
      context: ./
      dockerfile: ./docker/images/01mysql9/Dockerfile
    command:
      - mysqld
      # - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=${GLOBAL_STACK_DATABASE_CHARSET}
      - --collation-server=${GLOBAL_STACK_DATABASE_COLLATE}
    depends_on:
      00base:
        condition: service_healthy
        required: true
    environment:
      - MYSQL_DBS=${GLOBAL_STACK_MYSQL9_DBS}
      - MYSQL_PASSWORD=${GLOBAL_STACK_DATABASE_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${GLOBAL_STACK_DATABASE_ROOT_PASSWORD}
      - MYSQL_USER=${GLOBAL_STACK_DATABASE_USER}
      - GLOBAL_STACK_DATABASE_CHARSET=${GLOBAL_STACK_DATABASE_CHARSET}
      - GLOBAL_STACK_DATABASE_COLLATE=${GLOBAL_STACK_DATABASE_COLLATE}
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - TZ=${GLOBAL_STACK_TIMEZONE}
      - GLOBAL_STACK_DOCKER_TOOLS_PATH=${GLOBAL_STACK_DOCKER_TOOLS_PATH}
      - GLOBAL_STACK_DOCKER_TOOLS_PATH_SUCCESSES=${GLOBAL_STACK_DOCKER_TOOLS_PATH_SUCCESSES}
      - GLOBAL_STACK_DOCKER_TOOLS_PATH_ERRORS=${GLOBAL_STACK_DOCKER_TOOLS_PATH_ERRORS}
      - GLOBAL_STACK_DOCKER_ROOT_DIST_PATH=${GLOBAL_STACK_DOCKER_ROOT_DIST_PATH}
      - GLOBAL_STACK_WAIT_FOR_TIMEOUT=${GLOBAL_STACK_WAIT_FOR_TIMEOUT}
    healthcheck:
      test: ["CMD-SHELL", "${GLOBAL_STACK_DOCKER_ROOT_DIST_PATH}/bin/base-bin/global-stack-base-healthcheck-elapsed.sh 01mysql9 mysqladmin ping -h localhost -u ${GLOBAL_STACK_DOCKER_USER_ID} -p${GLOBAL_STACK_DATABASE_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      stack.service: "01mysql9"
      stack.tier: "database"
      stack.version: "${GLOBAL_STACK_VERSION}"
    networks:
      - public
    restart: "on-failure:5"
    ports:
      - ${GLOBAL_STACK_MYSQL9_PORT_3306:-}3306
      - ${GLOBAL_STACK_MYSQL9_PORT_33060:-}33060
    volumes:
      - ./tools:${GLOBAL_STACK_DOCKER_TOOLS_PATH}:rw
      - ./docker/config/dist/bin:${GLOBAL_STACK_DOCKER_ROOT_DIST_PATH}/bin:rw
      - ./docker/data/dumps/mysql/9:/opt/dumps:rw
      - 01mysql9_data:/var/lib/mysql:rw,delegated
      - ./${GLOBAL_STACK_SHELL_HISTORY}:/root/${GLOBAL_STACK_SHELL_HISTORY_TARGET}:rw
      - ./${GLOBAL_STACK_SHELL_ZSH_HISTORY}:/root/${GLOBAL_STACK_SHELL_ZSH_HISTORY_TARGET}:rw
        # - ./var/database-history/.mysql_history:/root/.mysql_history:rw,delegated
        # - source: ./docker/logs/mysql/9
        #   target: /var/log/mysql
        #   type: bind
volumes:
  01mysql9_data:
    name: ${COMPOSE_PROJECT_NAME}_${GLOBAL_STACK_VERSION}_01mysql9_data
