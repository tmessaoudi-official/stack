---
services:
  01valkey:
    init: ${DOCKER_INIT}
    image: valkey/valkey:${GLOBAL_STACK_VALKEY_VERSION}
    ports:
      - ${GLOBAL_STACK_VALKEY_PORT_6379:-}6379
    volumes:
      - 01valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      stack.service: "01valkey"
      stack.tier: "cache"
      stack.version: "${GLOBAL_STACK_VERSION}"
    restart: "on-failure:5"
    networks:
      - public
volumes:
  01valkey_data:
    name: ${COMPOSE_PROJECT_NAME}_${GLOBAL_STACK_VERSION}_01valkey_data
