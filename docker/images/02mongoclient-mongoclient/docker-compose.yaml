---
services:
  02mongoclient-mongoclient:
    init: ${DOCKER_INIT}
    build:
      args:
        BUILDKIT_INLINE_CACHE: 1
        GLOBAL_STACK_IMAGE_MONGOCLIENT_MONGOCLIENT_VERSION: ${GLOBAL_STACK_IMAGE_MONGOCLIENT_MONGOCLIENT_VERSION}
      context: ./
      dockerfile: ./docker/images/02mongoclient-mongoclient/Dockerfile
    environment:
      - MONGO_URL=${GLOBAL_STACK_MONGOCLIENT_MONGOCLIENT_DEFAULT_MONGO_URL}
    networks:
      - public
    ports:
      - ${GLOBAL_STACK_MONGOCLIENT_MONGOCLIENT_PORT_3000:-}3000
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/ -o /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      stack.service: "02mongoclient-mongoclient"
      stack.tier: "tools"
      stack.version: "${GLOBAL_STACK_VERSION}"
    restart: "on-failure:5"
    volumes:
      - ./${GLOBAL_STACK_SHELL_HISTORY}:/home/node/${GLOBAL_STACK_SHELL_HISTORY_TARGET}:rw
      - ./${GLOBAL_STACK_SHELL_ZSH_HISTORY}:/home/node/${GLOBAL_STACK_SHELL_ZSH_HISTORY_TARGET}:rw
