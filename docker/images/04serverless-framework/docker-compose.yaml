---
services:
  04serverless-framework:
    extends:
      file: docker/config/compose-fragments/base.compose.yaml
      service: base
    build:
      args:
        BUILDKIT_INLINE_CACHE: 1
        GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_ALIAS: ${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_ALIAS}
        GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_PORT_5000: ${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_PORT_5000}
        GLOBAL_STACK_VERSION: ${GLOBAL_STACK_VERSION}
        GLOBAL_STACK_RBENV_LOCALE: ${GLOBAL_STACK_RBENV_LOCALE}
        GLOBAL_STACK_RBENV_SET_LOCALE: ${GLOBAL_STACK_RBENV_SET_LOCALE}
      context: ./
      dockerfile: ./docker/images/04serverless-framework/Dockerfile
    ports:
      - ${GLOBAL_STACK_SERVERLESS_FRAMEWORK_PORT_3000:-}3000 # Serverless Api Gateway
      - ${GLOBAL_STACK_SERVERLESS_FRAMEWORK_PORT_3002:-}3002 # Serverless Lambda
      - ${GLOBAL_STACK_SERVERLESS_FRAMEWORK_PORT_4569:-}4569 # Serverless S3
      - ${GLOBAL_STACK_SERVERLESS_FRAMEWORK_PORT_9324:-}9324 # Serverless SQS
      - ${GLOBAL_STACK_SERVERLESS_FRAMEWORK_PORT_9325:-}9325 # Serverless SQS rest-stats
      - ${GLOBAL_STACK_SERVERLESS_FRAMEWORK_PORT_4002:-}4002 # Serverless SNS
    environment:
      - GLOBAL_STACK_PYENV_VERSION=${GLOBAL_STACK_PYENV_VERSION}
      - GLOBAL_STACK_PYTHON_STABLE=${GLOBAL_STACK_PYTHON_STABLE}
      - GLOBAL_STACK_RELOAD_PYENV=${GLOBAL_STACK_RELOAD_PYENV}
      - PYENV_ROOT=${GLOBAL_STACK_PYENV_ROOT}
      - PYTHON_VERSION=${GLOBAL_STACK_PYTHON3_VERSION}
      - PYTHON_VERSION_AS=${GLOBAL_STACK_PYTHON3_VERSION_AS}
      - GLOBAL_STACK_PYTHON_STABLE=${GLOBAL_STACK_PYTHON3_STABLE}
      - GLOBAL_STACK_DENO_ALEPH_VERSION=${GLOBAL_STACK_DENO_ALEPH_VERSION}
      - GLOBAL_STACK_DENO_MANDARINETS_VERSION=${GLOBAL_STACK_DENO_MANDARINETS_VERSION}
      - GLOBAL_STACK_DENO_VERSION=${GLOBAL_STACK_DENO_VERSION}
      - GLOBAL_STACK_NVM_VERSION=${GLOBAL_STACK_NVM_VERSION}
      - GLOBAL_STACK_RELOAD_NVM=${GLOBAL_STACK_RELOAD_NVM}
      - DENO_INSTALL=${GLOBAL_STACK_DENO_INSTALL}
      - DENO_INSTALL_ROOT=${GLOBAL_STACK_DENO_INSTALL_ROOT}
      - DENO_DIR=${GLOBAL_STACK_DENO_DIR}
      - BUN_INSTALL=${GLOBAL_STACK_BUN_INSTALL}
      - NVM_DIR=${GLOBAL_STACK_NVM_DIR}
      - YARN_OFFLINE_MIRROR=${GLOBAL_STACK_YARN_OFFLINE_MIRROR}
      - YARN_CACHE_FOLDER=${GLOBAL_STACK_YARN_CACHE_FOLDER}
      - YARN_GLOBAL_FOLDER=${GLOBAL_STACK_YARN_GLOBAL_FOLDER}
      - GLOBAL_STACK_PNPM_GLOBAL_DIR=${GLOBAL_STACK_PNPM_GLOBAL_DIR}
      - PNPM_HOME=${GLOBAL_STACK_PNPM_GLOBAL_DIR}
      - GLOBAL_STACK_PNPM_STORE_DIR=${GLOBAL_STACK_PNPM_STORE_DIR}
      - NPM_CACHE_DIR=${GLOBAL_STACK_NPM_CACHE_DIR}
      - CYPRESS_CACHE_FOLDER=${GLOBAL_STACK_CYPRESS_CACHE_FOLDER}
      - NODE_VERSION_AS=${GLOBAL_STACK_NODE24_VERSION_AS}
      - NODE_VERSION=${GLOBAL_STACK_NODE24_VERSION}
      - GLOBAL_STACK_SDKMAN_VERSION=${GLOBAL_STACK_SDKMAN_VERSION}
      - SDKMAN_DIR=${GLOBAL_STACK_SDKMAN_DIR}
      - JAVA_VERSION_AS=${GLOBAL_STACK_JAVA25_VERSION_AS}
      - JAVA_VERSION=${GLOBAL_STACK_JAVA25_VERSION}
      - SDKMAN_CONFIG_PACKAGE_DUMMY_NAME=dummy
      - SDKMAN_INSTALL_PACKAGE_DUMMY_VERSION=0
      - SDKMAN_CONFIG_PACKAGE_01_ANT_NAME=${GLOBAL_STACK_JAVA_CONFIG_PACKAGE_ANT_NAME}
      - SDKMAN_INSTALL_PACKAGE_01_ANT_VERSION=${GLOBAL_STACK_JAVA_INSTALL_PACKAGE_ANT_VERSION}
      - SDKMAN_CONFIG_PACKAGE_02_GRADLE_NAME=${GLOBAL_STACK_JAVA_CONFIG_PACKAGE_GRADLE_VX1_NAME}
      - SDKMAN_INSTALL_PACKAGE_02_GRADLE_VERSION=${GLOBAL_STACK_JAVA_INSTALL_PACKAGE_GRADLE_VX1_VERSION}
      - SDKMAN_CONFIG_PACKAGE_03_KOTLIN_NAME=${GLOBAL_STACK_JAVA_CONFIG_PACKAGE_KOTLIN_NAME}
      - SDKMAN_INSTALL_PACKAGE_03_KOTLIN_VERSION=${GLOBAL_STACK_JAVA_INSTALL_PACKAGE_KOTLIN_VERSION}
      - SDKMAN_CONFIG_PACKAGE_04_MAVEN_NAME=${GLOBAL_STACK_JAVA_CONFIG_PACKAGE_MAVEN_VX1_NAME}
      - SDKMAN_INSTALL_PACKAGE_04_MAVEN_VERSION=${GLOBAL_STACK_JAVA_INSTALL_PACKAGE_MAVEN_VX1_VERSION}
      - SDKMAN_CONFIG_PACKAGE_05_POMCHECKER_NAME=${GLOBAL_STACK_JAVA_CONFIG_PACKAGE_POMCHECKER_NAME}
      - SDKMAN_INSTALL_PACKAGE_05_POMCHECKER_VERSION=${GLOBAL_STACK_JAVA_INSTALL_PACKAGE_POMCHECKER_VERSION}
      - SDKMAN_CONFIG_PACKAGE_06_SPRINGBOOT_NAME=${GLOBAL_STACK_JAVA_CONFIG_PACKAGE_SPRINGBOOT_NAME}
      - SDKMAN_INSTALL_PACKAGE_06_SPRINGBOOT_VERSION=${GLOBAL_STACK_JAVA_INSTALL_PACKAGE_SPRINGBOOT_VERSION}
      - SDKMAN_CONFIG_PACKAGE_07_TOMCAT_NAME=${GLOBAL_STACK_JAVA_CONFIG_PACKAGE_TOMCAT_NAME}
      - SDKMAN_INSTALL_PACKAGE_07_TOMCAT_VERSION=${GLOBAL_STACK_JAVA_INSTALL_PACKAGE_TOMCAT_VERSION}
      - SDKMAN_CONFIG_PACKAGE_08_GROOVY_NAME=${GLOBAL_STACK_JAVA_CONFIG_PACKAGE_GROOVY_VX2_NAME}
      - SDKMAN_INSTALL_PACKAGE_08_GROOVY_VERSION=${GLOBAL_STACK_JAVA_INSTALL_PACKAGE_GROOVY_VX2_VERSION}
      - SDKMAN_CONFIG_PACKAGE_09_MICRONAUT_NAME=${GLOBAL_STACK_JAVA_CONFIG_PACKAGE_MICRONAUT_NAME}
      - SDKMAN_INSTALL_PACKAGE_09_MICRONAUT_VERSION=${GLOBAL_STACK_JAVA_INSTALL_PACKAGE_MICRONAUT_VERSION}
      - SDKMAN_CONFIG_PACKAGE_10_QUARKUS_NAME=${GLOBAL_STACK_JAVA_CONFIG_PACKAGE_QUARKUS_NAME}
      - SDKMAN_INSTALL_PACKAGE_10_QUARKUS_VERSION=${GLOBAL_STACK_JAVA_INSTALL_PACKAGE_QUARKUS_VERSION}
      - SDKMAN_CONFIG_PACKAGE_11_SPARK_NAME=${GLOBAL_STACK_JAVA_CONFIG_PACKAGE_SPARK_VX2_NAME}
      - SDKMAN_INSTALL_PACKAGE_11_SPARK_VERSION=${GLOBAL_STACK_JAVA_INSTALL_PACKAGE_SPARK_VX2_VERSION}
      - GLOBAL_STACK_RBENV_VERSION=${GLOBAL_STACK_RBENV_VERSION}
      - GLOBAL_STACK_RBENV_RUBY_BUILD_VERSION=${GLOBAL_STACK_RBENV_RUBY_BUILD_VERSION}
      - GLOBAL_STACK_RBENV_GEMSET_VERSION=${GLOBAL_STACK_RBENV_GEMSET_VERSION}
      - GLOBAL_STACK_RELOAD_RUBY=${GLOBAL_STACK_RELOAD_RUBY}
      - RBENV_ROOT=${GLOBAL_STACK_RBENV_ROOT}
      - RUBY_CONFIG_PACKAGE_01_GOOGLE_API_CLIENT_NAME=${GLOBAL_STACK_RUBY_CONFIG_PACKAGE_GOOGLE_API_CLIENT_NAME}
      - RUBY_INSTALL_PACKAGE_01_GOOGLE_API_CLIENT_VERSION=${GLOBAL_STACK_RUBY_INSTALL_PACKAGE_GOOGLE_API_CLIENT_VERSION}
      - RUBY_CONFIG_PACKAGE_02_FASTLANE_NAME=${GLOBAL_STACK_RUBY_CONFIG_PACKAGE_FASTLANE_NAME}
      - RUBY_INSTALL_PACKAGE_02_FASTLANE_VERSION=${GLOBAL_STACK_RUBY_INSTALL_PACKAGE_FASTLANE_VERSION}
      - RUBY_VERSION=${GLOBAL_STACK_RUBY4_VERSION}
      - RUBY_VERSION_AS=${GLOBAL_STACK_RUBY4_VERSION_AS}
      - GLOBAL_STACK_COMPOSER_VERSION=${GLOBAL_STACK_COMPOSER_VERSION}
      - GLOBAL_STACK_DEPLOYER_VERSION=${GLOBAL_STACK_DEPLOYER_VERSION}
      - GLOBAL_STACK_FABPOT_LOCAL_PHP_SECURITY_CHECKER_VERSION=${GLOBAL_STACK_FABPOT_LOCAL_PHP_SECURITY_CHECKER_VERSION}
      - GLOBAL_STACK_FRANKENPHP_VERSION=${GLOBAL_STACK_FRANKENPHP_EDGE_VERSION}
      - GLOBAL_STACK_PHALCON_DEVTOOLS_VERSION=${GLOBAL_STACK_PHALCON_DEVTOOLS_VERSION}
      - GLOBAL_STACK_PHPBREW_VERSION=${GLOBAL_STACK_PHPBREW_VERSION}
      - GLOBAL_STACK_PICKLE_VERSION=${GLOBAL_STACK_PICKLE_VERSION}
      - GLOBAL_STACK_PIE_VERSION=${GLOBAL_STACK_PIE_VERSION}
      - GLOBAL_STACK_MAGO_VERSION=${GLOBAL_STACK_MAGO_VERSION}
      - GLOBAL_STACK_CASTOR_VERSION=${GLOBAL_STACK_CASTOR_VERSION}
      - GLOBAL_STACK_RELOAD_PHPBREW=${GLOBAL_STACK_RELOAD_PHPBREW}
      - GLOBAL_STACK_RELOAD_PHP=${GLOBAL_STACK_RELOAD_PHPEDGE}
      - GLOBAL_STACK_SYMFONY_CLI_VERSION=${GLOBAL_STACK_SYMFONY_CLI_VERSION}
      - GLOBAL_STACK_ZEPHIR_LANG_VERSION=${GLOBAL_STACK_ZEPHIR_LANG_VERSION}
      - PHPBREW_BIN=${GLOBAL_STACK_PHPBREW_BIN}
      - PHPBREW_HOME=${GLOBAL_STACK_PHPBREW_HOME}
      - PHPBREW_ROOT=${GLOBAL_STACK_PHPBREW_ROOT}
      - PHPBREW_SRC=${GLOBAL_STACK_PHPBREW_SRC}
      - PHPBREW_SET_PROMPT=${GLOBAL_STACK_PHPBREW_SET_PROMPT}
      - PHPBREW_SKIP_INIT=${GLOBAL_STACK_PHPBREW_SKIP_INIT}
      - PHPBREW_RC_ENABLE=${GLOBAL_STACK_PHPBREW_RC_ENABLE}
      - COMPOSER_HOME=${GLOBAL_STACK_COMPOSER_HOME}
      - COMPOSER_SOURCE=${GLOBAL_STACK_COMPOSER_SOURCE}
      - SYMFONY_HOME=${GLOBAL_STACK_SYMFONY_HOME}
      - PHP_VERSION=${GLOBAL_STACK_PHP8_5_VERSION}
      - PHP_VERSION_NAME=${GLOBAL_STACK_PHP8_5_VERSION_NAME}
      - PHP_VERSION_AS=${GLOBAL_STACK_PHP8_5_VERSION_AS}
      - GLOBAL_STACK_RELOAD_RUST=${GLOBAL_STACK_RELOAD_RUST}
      - GLOBAL_STACK_RUST_VERSION=${GLOBAL_STACK_RUST_VERSION}
      - GLOBAL_STACK_RUSTUP_INIT_VERSION=${GLOBAL_STACK_RUSTUP_INIT_VERSION}
      - RUSTUP_HOME=${GLOBAL_STACK_RUSTUP_HOME}
      - CARGO_HOME=${GLOBAL_STACK_CARGO_HOME}
      - AMAZON_ACCOUNT_ID=${GLOBAL_STACK_SERVERLESS_FRAMEWORK_SERVERLESS_AMAZON_ACCOUNT_ID}
      - S3RVER_AMAZON_ACCOUNT_DISPLAY_NAME=${GLOBAL_STACK_SERVERLESS_FRAMEWORK_SERVERLESS_S3RVER_AMAZON_DISPLAY_NAME}
      - SERVERLESS_VERSION=${GLOBAL_STACK_NODE_INSTALL_PACKAGE_SERVERLESS_VERSION}
      - GLOBAL_STACK_SERVERLESS_FRAMEWORK_ELASTICMQ_VERSION=${GLOBAL_STACK_SERVERLESS_FRAMEWORK_ELASTICMQ_VERSION}
      - AWS_ENDPOINT_URL_S3=${GLOBAL_STACK_SERVERLESS_FRAMEWORK_AWS_ENDPOINT_URL_S3}
      - AWS_ENDPOINT_URL_SQS=${GLOBAL_STACK_SERVERLESS_FRAMEWORK_AWS_ENDPOINT_URL_SQS}
      - AWS_ENDPOINT_URL_LAMBDA=${GLOBAL_STACK_SERVERLESS_FRAMEWORK_AWS_ENDPOINT_URL_LAMBDA}
      - AWS_ENDPOINT_URL_SNS=${GLOBAL_STACK_SERVERLESS_FRAMEWORK_AWS_ENDPOINT_URL_SNS}
      - AWS_ENDPOINT_URL_SNS_NOTIFICATION_ENDPOINT=${GLOBAL_STACK_SERVERLESS_FRAMEWORK_AWS_ENDPOINT_URL_SNS_NOTIFICATION_ENDPOINT}
      - AWS_ACCESS_KEY_ID=${GLOBAL_STACK_SERVERLESS_FRAMEWORK_AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${GLOBAL_STACK_SERVERLESS_FRAMEWORK_AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${GLOBAL_STACK_SERVERLESS_FRAMEWORK_AWS_REGION}
      - AWS_DEFAULT_REGION=${GLOBAL_STACK_SERVERLESS_FRAMEWORK_AWS_DEFAULT_REGION}
      - AWS_CA_BUNDLE=${GLOBAL_STACK_BASE_AWS_CA_BUNDLE}
      - NODE_EXTRA_CA_CERTS=${GLOBAL_STACK_BASE_NODE_EXTRA_CA_CERTS}
      - SSL_CERT_FILE=${GLOBAL_STACK_BASE_SSL_CERT_FILE}
      - REQUESTS_CA_BUNDLE=${GLOBAL_STACK_BASE_REQUESTS_CA_BUNDLE}
      - CURL_CA_BUNDLE=${GLOBAL_STACK_BASE_CURL_CA_BUNDLE}
      - SERVERLESS_ACCESS_KEY=${GLOBAL_STACK_SERVERLESS_FRAMEWORK_SERVERLESS_ACCESS_KEY}
      - GLOBAL_STACK_DOCKER_USER_EMAIL=${GLOBAL_STACK_DOCKER_USER_EMAIL}
      - GLOBAL_STACK_DOCKER_USER_NAME=${GLOBAL_STACK_DOCKER_USER_NAME}
      - GLOBAL_STACK_ERROR_TOKEN=serverless
    depends_on:
      00base:
        condition: service_healthy
        required: true
      02nvm:
        condition: service_healthy
        required: true
      02sdkman:
        condition: service_healthy
        required: true
      02rbenv:
        condition: service_healthy
        required: true
      02pyenv:
        condition: service_healthy
        required: true
      02phpbrew:
        condition: service_healthy
        required: true
      02rust:
        condition: service_healthy
        required: true
      03node24:
        condition: service_healthy
        required: true
      03java25-zulu:
        condition: service_healthy
        required: true
      03ruby4:
        condition: service_healthy
        required: true
      03python3:
        condition: service_healthy
        required: true
      03phpedge:
        condition: service_healthy
        required: true
    healthcheck:
      test: ["CMD-SHELL", "! test -f ${GLOBAL_STACK_DOCKER_TOOLS_PATH_ERRORS}/serverless && test -f ${GLOBAL_STACK_DOCKER_TOOLS_PATH_SUCCESSES}/serverless || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 99999
      start_period: 24h
    labels:
      stack.service: "04serverless-framework"
      stack.tier: "tools"
      stack.version: "${GLOBAL_STACK_VERSION}"
    working_dir: ${GLOBAL_STACK_DOCKER_TOOLS_PATH}/serverless-framework
    volumes:
      - 04serverless_framework_lib_docker:/var/lib/docker:rw,delegated
volumes:
  04serverless_framework_lib_docker:
    name: ${COMPOSE_PROJECT_NAME}_${GLOBAL_STACK_VERSION}_04serverless_framework_lib_docker
