---
# Python runtime package fragment — extend this in 03python* services.
#
# Provides: all shared PYTHON_CONFIG_PACKAGE_* and PYTHON_INSTALL_PACKAGE_*
#           environment variables (packages 01-25 + dummy sentinel).
#
# Chain: 03python* → python-packages → base-6vol.compose.yaml
#           (inherits 6-volume base: no dist/conf mount)
#
# NOT included (service-specific): build, image, depends_on, environment vars
#   for PYENV_MODE, PYTHON_VERSION/VERSION_AS, GLOBAL_STACK_PYENV_VERSION,
#   GLOBAL_STACK_RELOAD_PYENV, GLOBAL_STACK_ERROR_TOKEN,
#   healthcheck, labels.stack.service/tier.
services:
  python-packages:
    extends:
      file: base-6vol.compose.yaml
      service: base-6vol
    environment:
      - PYTHON_CONFIG_PACKAGE_DUMMY_NAME=dummy
      - PYTHON_INSTALL_PACKAGE_DUMMY_VERSION=0
      - PYTHON_CONFIG_PACKAGE_01_PIP_NAME=${GLOBAL_STACK_PYTHON_CONFIG_PACKAGE_PIP_NAME}
      - PYTHON_INSTALL_PACKAGE_01_PIP_VERSION=${GLOBAL_STACK_PYTHON_INSTALL_PACKAGE_PIP_VERSION}
      - PYTHON_CONFIG_PACKAGE_02_PYYAML_NAME=${GLOBAL_STACK_PYTHON_CONFIG_PACKAGE_PYYAML_NAME}
      - PYTHON_INSTALL_PACKAGE_02_PYYAML_VERSION=${GLOBAL_STACK_PYTHON_INSTALL_PACKAGE_PYYAML_VERSION}
      - PYTHON_CONFIG_PACKAGE_03_BLINKER_NAME=${GLOBAL_STACK_PYTHON_CONFIG_PACKAGE_BLINKER_NAME}
      - PYTHON_INSTALL_PACKAGE_03_BLINKER_VERSION=${GLOBAL_STACK_PYTHON_INSTALL_PACKAGE_BLINKER_VERSION}
      - PYTHON_CONFIG_PACKAGE_04_PIPENV_NAME=${GLOBAL_STACK_PYTHON_CONFIG_PACKAGE_PIPENV_NAME}
      - PYTHON_INSTALL_PACKAGE_04_PIPENV_VERSION=${GLOBAL_STACK_PYTHON_INSTALL_PACKAGE_PIPENV_VERSION}
      - PYTHON_CONFIG_PACKAGE_05_SIMPLEJSON_NAME=${GLOBAL_STACK_PYTHON_CONFIG_PACKAGE_SIMPLEJSON_NAME}
      - PYTHON_INSTALL_PACKAGE_05_SIMPLEJSON_VERSION=${GLOBAL_STACK_PYTHON_INSTALL_PACKAGE_SIMPLEJSON_VERSION}
      - PYTHON_CONFIG_PACKAGE_06_PYTHON_DOTENV_NAME=${GLOBAL_STACK_PYTHON_CONFIG_PACKAGE_PYTHON_DOTENV_NAME}
      - PYTHON_INSTALL_PACKAGE_06_PYTHON_DOTENV_VERSION=${GLOBAL_STACK_PYTHON_INSTALL_PACKAGE_PYTHON_DOTENV_VERSION}
      - PYTHON_CONFIG_PACKAGE_07_WATCHDOG_NAME=${GLOBAL_STACK_PYTHON_CONFIG_PACKAGE_WATCHDOG_NAME}
      - PYTHON_INSTALL_PACKAGE_07_WATCHDOG_VERSION=${GLOBAL_STACK_PYTHON_INSTALL_PACKAGE_WATCHDOG_VERSION}
      - PYTHON_CONFIG_PACKAGE_08_VIRTUALENV_NAME=${GLOBAL_STACK_PYTHON_CONFIG_PACKAGE_VIRTUALENV_NAME}
