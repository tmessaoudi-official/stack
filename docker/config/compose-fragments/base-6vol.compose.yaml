---
# 6-volume base fragment — services that mount dist/bin but NOT dist/conf.
# Services: 02pyenv, 02rbenv, 02rust, 03python3, 03ruby3, 03ruby4
#
# Volumes use ${GLOBAL_STACK_DOCKER_ROOT_PATH} for absolute path resolution
# because extends: resolves relative paths from the base file's directory,
# not the extending file's directory.
#
# NOT included (service-specific): build, image, depends_on, environment,
#   healthcheck, labels.stack.service, labels.stack.tier, ports.
services:
  base-6vol:
    init: ${DOCKER_INIT}
    cap_add:
      - NET_ADMIN
    restart: "on-failure:5"
    privileged: true
    networks:
      - public
    working_dir: ${GLOBAL_STACK_DOCKER_WORKDIR}
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:rw,delegated
      - ${GLOBAL_STACK_DOCKER_ROOT_PATH}/projects:${GLOBAL_STACK_DOCKER_WORKDIR}:rw
      - ${GLOBAL_STACK_DOCKER_ROOT_PATH}/tools:${GLOBAL_STACK_DOCKER_TOOLS_PATH}:rw
      - ${GLOBAL_STACK_DOCKER_ROOT_PATH}/${GLOBAL_STACK_SHELL_HISTORY}:/home/${GLOBAL_STACK_DOCKER_USER_ID}/${GLOBAL_STACK_SHELL_HISTORY_TARGET}:rw
      - ${GLOBAL_STACK_DOCKER_ROOT_PATH}/docker/config/root:${GLOBAL_STACK_DOCKER_ROOT_DIST_PATH}/home/user:rw
      - ${GLOBAL_STACK_DOCKER_ROOT_PATH}/docker/config/dist/bin:${GLOBAL_STACK_DOCKER_ROOT_DIST_PATH}/bin:rw
    extra_hosts:
      - ${GLOBAL_STACK_DOCKER_LOCAL_REGISTRY_ALIAS}:${GLOBAL_STACK_HOST_GATEWAY_IP}
      - ${GLOBAL_STACK_DOCKER_HOST_DSN}:${GLOBAL_STACK_HOST_GATEWAY_IP}
      - ${GLOBAL_STACK_EXPOSED_VIRTUAL_HOSTS}:${GLOBAL_STACK_HOST_GATEWAY_IP}
    labels:
      stack.version: "${GLOBAL_STACK_VERSION}"
