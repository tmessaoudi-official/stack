---
# Java runtime package fragment — extend this in 03java* services.
#
# Provides: all shared SDKMAN_CONFIG_PACKAGE_* and SDKMAN_INSTALL_PACKAGE_*
#           environment variables (packages 01-13 + dummy sentinel).
#           Note: container env vars use SDKMAN_ prefix (not JAVA_); .env uses
#           GLOBAL_STACK_JAVA_* as the shared source variables.
#
# Chain: 03java* → java-packages → base.compose.yaml (inherits all base config)
#
# NOT included (service-specific): build, image, depends_on, environment vars
#   for SDKMAN_MODE, JAVA_VERSION/VERSION_AS, GLOBAL_STACK_SDKMAN_VERSION,
#   GLOBAL_STACK_RELOAD_SDKMAN, GLOBAL_STACK_ERROR_TOKEN,
#   healthcheck, labels.stack.service/tier.
services:
  java-packages:
    extends:
      file: base.compose.yaml
      service: base
    environment:
      - SDKMAN_CONFIG_PACKAGE_DUMMY_NAME=dummy
      - SDKMAN_INSTALL_PACKAGE_DUMMY_VERSION=0
      - SDKMAN_CONFIG_PACKAGE_01_ANT_NAME=${GLOBAL_STACK_JAVA_CONFIG_PACKAGE_ANT_NAME}
      - SDKMAN_INSTALL_PACKAGE_01_ANT_VERSION=${GLOBAL_STACK_JAVA_INSTALL_PACKAGE_ANT_VERSION}
      - SDKMAN_CONFIG_PACKAGE_02_GRADLE_VX1_NAME=${GLOBAL_STACK_JAVA_CONFIG_PACKAGE_GRADLE_VX1_NAME}
      - SDKMAN_INSTALL_PACKAGE_02_GRADLE_VX1_VERSION=${GLOBAL_STACK_JAVA_INSTALL_PACKAGE_GRADLE_VX1_VERSION}
      - SDKMAN_CONFIG_PACKAGE_02_GRADLE_VX2_NAME=${GLOBAL_STACK_JAVA_CONFIG_PACKAGE_GRADLE_VX2_NAME}
      - SDKMAN_INSTALL_PACKAGE_02_GRADLE_VX2_VERSION=${GLOBAL_STACK_JAVA_INSTALL_PACKAGE_GRADLE_VX2_VERSION}
      - SDKMAN_CONFIG_PACKAGE_03_KOTLIN_NAME=${GLOBAL_STACK_JAVA_CONFIG_PACKAGE_KOTLIN_NAME}
      - SDKMAN_INSTALL_PACKAGE_03_KOTLIN_VERSION=${GLOBAL_STACK_JAVA_INSTALL_PACKAGE_KOTLIN_VERSION}
      - SDKMAN_CONFIG_PACKAGE_04_MAVEN_VX1_NAME=${GLOBAL_STACK_JAVA_CONFIG_PACKAGE_MAVEN_VX1_NAME}
      - SDKMAN_INSTALL_PACKAGE_04_MAVEN_VX1_VERSION=${GLOBAL_STACK_JAVA_INSTALL_PACKAGE_MAVEN_VX1_VERSION}
      - SDKMAN_CONFIG_PACKAGE_04_MAVEN_VX2_NAME=${GLOBAL_STACK_JAVA_CONFIG_PACKAGE_MAVEN_VX2_NAME}
      - SDKMAN_INSTALL_PACKAGE_04_MAVEN_VX2_VERSION=${GLOBAL_STACK_JAVA_INSTALL_PACKAGE_MAVEN_VX2_VERSION}
      - SDKMAN_CONFIG_PACKAGE_04_MAVEN_VX3_NAME=${GLOBAL_STACK_JAVA_CONFIG_PACKAGE_MAVEN_VX3_NAME}
      - SDKMAN_INSTALL_PACKAGE_04_MAVEN_VX3_VERSION=${GLOBAL_STACK_JAVA_INSTALL_PACKAGE_MAVEN_VX3_VERSION}
      - SDKMAN_CONFIG_PACKAGE_05_POMCHECKER_NAME=${GLOBAL_STACK_JAVA_CONFIG_PACKAGE_POMCHECKER_NAME}
      - SDKMAN_INSTALL_PACKAGE_05_POMCHECKER_VERSION=${GLOBAL_STACK_JAVA_INSTALL_PACKAGE_POMCHECKER_VERSION}
      - SDKMAN_CONFIG_PACKAGE_06_SPRINGBOOT_NAME=${GLOBAL_STACK_JAVA_CONFIG_PACKAGE_SPRINGBOOT_NAME}
      - SDKMAN_INSTALL_PACKAGE_06_SPRINGBOOT_VERSION=${GLOBAL_STACK_JAVA_INSTALL_PACKAGE_SPRINGBOOT_VERSION}
      - SDKMAN_CONFIG_PACKAGE_07_TOMCAT_NAME=${GLOBAL_STACK_JAVA_CONFIG_PACKAGE_TOMCAT_NAME}
      - SDKMAN_INSTALL_PACKAGE_07_TOMCAT_VERSION=${GLOBAL_STACK_JAVA_INSTALL_PACKAGE_TOMCAT_VERSION}
      - SDKMAN_CONFIG_PACKAGE_08_GROOVY_VX1_NAME=${GLOBAL_STACK_JAVA_CONFIG_PACKAGE_GROOVY_VX1_NAME}
      - SDKMAN_INSTALL_PACKAGE_08_GROOVY_VX1_VERSION=${GLOBAL_STACK_JAVA_INSTALL_PACKAGE_GROOVY_VX1_VERSION}
      - SDKMAN_CONFIG_PACKAGE_08_GROOVY_VX2_NAME=${GLOBAL_STACK_JAVA_CONFIG_PACKAGE_GROOVY_VX2_NAME}
      - SDKMAN_INSTALL_PACKAGE_08_GROOVY_VX2_VERSION=${GLOBAL_STACK_JAVA_INSTALL_PACKAGE_GROOVY_VX2_VERSION}
      - SDKMAN_CONFIG_PACKAGE_09_MICRONAUT_NAME=${GLOBAL_STACK_JAVA_CONFIG_PACKAGE_MICRONAUT_NAME}
