      - SDKMAN_CONFIG_PACKAGE_10_QUARKUS_NAME=${GLOBAL_STACK_JAVA_CONFIG_PACKAGE_QUARKUS_NAME}
      - SDKMAN_INSTALL_PACKAGE_10_QUARKUS_VERSION=${GLOBAL_STACK_JAVA_INSTALL_PACKAGE_QUARKUS_VERSION}
      - SDKMAN_CONFIG_PACKAGE_11_SPARK_VX1_NAME=${GLOBAL_STACK_JAVA_CONFIG_PACKAGE_SPARK_VX1_NAME}
      - SDKMAN_INSTALL_PACKAGE_11_SPARK_VX1_VERSION=${GLOBAL_STACK_JAVA_INSTALL_PACKAGE_SPARK_VX1_VERSION}
      - SDKMAN_CONFIG_PACKAGE_11_SPARK_VX2_NAME=${GLOBAL_STACK_JAVA_CONFIG_PACKAGE_SPARK_VX2_NAME}
