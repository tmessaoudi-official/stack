    location /back {
        alias ${GLOBAL_STACK_DOCKER_WORKDIR}/path/to/public;  # Adjust path to Symfony's public directory

        # PHP handling for Symfony
        location ~ \.php$ {
            fastcgi_pass 03php8-2:9000;  # PHP-FPM port
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
        }
        # Handle Symfony routes and files
        try_files $uri /back/index.php$is_args$args;
    }

    # Symfony API path at /api
    location /back/api {
        try_files $uri /back/index.php$is_args$args;
    }

    # Serve Symfony profiler at /_profiler
    location /back/_profiler {
        try_files $uri /back/index.php$is_args$args;
    }

    # Serve Symfony Web Debug Toolbar at /_wdt
    location /back/_wdt {
        try_files $uri /back/index.php$is_args$args;
    }

    # Serve static assets and bundles at /bundles
    location ^~ /bundles {
        alias ${GLOBAL_STACK_DOCKER_WORKDIR}/path/to/public/bundles;
        try_files $uri =404;
        expires max;
        access_log off;
    }