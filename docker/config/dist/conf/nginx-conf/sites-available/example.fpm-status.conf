php fpm config www.conf
pm.status_path = /fpm-status
ping.path = /fpm-ping
server {
    # Enable the PHP-FPM status page (Optional)
    location /fpm-status {
        # allow 127.0.0.1;  # Only allow from localhost for security
        # deny all;
        allow all;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
        include fastcgi_params;
        #fastcgi_pass 127.0.0.1:9000;
        fastcgi_pass   03php8-4:9000;
    }

    # Optionally, add a ping endpoint to check PHP-FPM health
    location /fpm-ping {
        # allow 127.0.0.1;  # Only allow from localhost for security
        # deny all;
        allow all;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
        include fastcgi_params;
        #fastcgi_pass 127.0.0.1:9000;
        fastcgi_pass   03php8-4:9000;
    }
}
