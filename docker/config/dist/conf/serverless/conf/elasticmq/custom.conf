ssl-config.default = true

pekko {
  # library-extensions = []
  actor {
    default-dispatcher {
      throughput = 1
    }
    ask-timeout = 60s
  }
}

spray.can.server.parsing.illegal-header-warnings = off

# What is the outside visible address of this ElasticMQ node
# Used to create the queue URL (may be different from bind address!)
node-address {
  protocol = "http"
  host = "0.0.0.0"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  # Possible values: relaxed, strict
  sqs-limits = strict
#   relaxed-header-validation = true
  authorization = "off"
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

# Should the node-address be generated from the bind port/hostname
# Set this to true e.g. when assigning port automatically by using port 0.
generate-node-address = false

queues {
#  queueName1 {
#     // all optional
#     defaultVisibilityTimeout = 10 seconds
#     delay = 5 seconds
#     maxReceiveCount = 3
#     receiveMessageWait = 0 seconds
#     deadLettersQueue {
#       // all mandatory
#       name = "myDLQ"
#       maxReceiveCount = 3
#     }
#     copyTo = "audit-queue-name"
#     moveTo = "redirect-queue-name"
#     tags {
#       tag1 = "tagged1",
#       tag2 = "tagged2"
#     }
#  }
}

queues-storage {
  enabled = true
  path = "${global_stack_process.customEnv.GLOBAL_STACK_DOCKER_TOOLS_PATH}/serverless-framework/var/storage/sqs-queues"
}

aws {
  region = "${global_stack_process.customEnv.AWS_REGION}"
  accountId = "${global_stack_process.customEnv.AMAZON_ACCOUNT_ID}"
}

messages-storage {
  enabled = true
  driver-class = "org.h2.Driver"
  uri = "jdbc:h2:${global_stack_process.customEnv.GLOBAL_STACK_DOCKER_TOOLS_PATH}/serverless-framework/var/storage/sqs-messages/elasticmq-h2"
  username = ""
  password = ""
  prune-data-on-init = false
}