php fpm config www.conf
pm.status_path = /fpm-status
ping.path = /fpm-ping
<VirtualHost *:8080>
    # Enable the PHP-FPM status page (Optional)
    <LocationMatch "/fpm-status">
        # Require ip 127.0.0.1  # Only allow from localhost for security
        # Order Allow,Deny
        # Allow from 127.0.0.1
        ProxyPass "fcgi://03php8-4:9000"
        Require all granted
    </LocationMatch>

    # Optionally, add a ping endpoint to check PHP-FPM health
    <LocationMatch "/fpm-ping">
        # Require ip 127.0.0.1  # Only allow from localhost for security
        # Order Allow,Deny
        # Allow from 127.0.0.1
        ProxyPass "fcgi://03php8-4:9000"
        Require all granted
    </LocationMatch>
</VirtualHost>
