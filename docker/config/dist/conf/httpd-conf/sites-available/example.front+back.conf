    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://03php8-2:9000"
    </FilesMatch>
    
    Alias /back "${GLOBAL_STACK_DOCKER_WORKDIR}/clts/grdf/tdr/b6tdr/back/public/"
    <Directory "${GLOBAL_STACK_DOCKER_WORKDIR}/clts/grdf/tdr/b6tdr/back/public/">
        AliasPreservePath on
        Options +Indexes +FollowSymLinks +ExecCGI
        Order allow,deny
        Allow from all
        AllowOverride All
        Require all granted

        Options -MultiViews
        RewriteEngine On
        RewriteCond %{REQUEST_URI} ^/back/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^/back/(.*)$ index.php [QSA,L]

        FallbackResource /index.php
    </Directory>